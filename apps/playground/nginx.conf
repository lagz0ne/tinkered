server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;

  # ES modules and wasm must carry the right Content-Type or the browser refuses them.
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
  }
  location ~* \.wasm$ {
    types { }
    default_type application/wasm;
  }

  # Never cache the HTML entry, so a redeploy shows immediately (hashed assets stay cacheable).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
