id: needsDefer
applies: [resource]
needs: [promise, work]
kind: boolean
status: provisional
ask: >-
  Does work start or hold something that
  must be released at close — a connection,
  timer, listener, transaction, buffer —
  while neither promise nor work says it
  is released (defer, close, stop, commit,
  rollback)?
true: >-
  it holds something that must be
  released, and neither promise nor
  work says it is released
false: >-
  promise or work says it is released,
  or it holds nothing that needs release
