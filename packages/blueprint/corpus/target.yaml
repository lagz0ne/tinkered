id: target
applies: [resource]
needs: [promise, why, work]
kind: choice
status: provisional
compare: target
ask: >-
  One copy for the whole scope,
  one per namespace until root close,
  or one per session and namespace?
choices:
  scope: >-
    one shared copy for the process:
    a database, a server, a cache,
    a pool, a wire
  session: >-
    one per request, tab, call, or turn:
    a transaction, a request context,
    per-call state
  namespace: >-
    one copy per namespace, owned by the root:
    separate service clients or tenant pools
    shared across requests until root close
