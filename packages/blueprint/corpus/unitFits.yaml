id: unitFits
applies: [data, resource, operation, tag, extension]
needs: [promise, why, work]
kind: choice
status: provisional
compare: kind
ask: >-
  Which unit fits this node:
  data, resource, operation, tag, or extension?
choices:
  data: >-
    a piece of state kept and read over
    time — a form field, a draft, a filter,
    a selection, a notice, a list — written
    by operations or a driver
  resource: >-
    something that subscribes, listens,
    polls, connects, opens, or streams;
    built once per owner; needs cleanup
  operation: >-
    something a user, request, CLI, or tool
    asks for; runs once per call with typed
    input; may have effects
  tag: >-
    an environment choice — a URL, path,
    flag, or setting — bound at the root
    and rebound in tests
  extension: >-
    an engine that controls work through
    hooks bound to the current owner and key;
    live state stays in resources or data
shapes:
  data: >-
    const x = data({ label: "x", initial });
    // written by an operation or a driver;
    read with watch / useData
  resource: >-
    const x = resource({ label: "x", target, depends,
    factory: (deps, { defer, signal }) => { …;
    defer(() => stop()); return api; } })
  operation: >-
    const x = operation({ label: "x", input: shape.parse,
    depends, run: async (deps, ctx) => { … } })
  tag: >-
    const x = tag<Config>({ label: "x" });
    // bound at the root:
    createScope({ tags: [x(value)] })
  extension: >-
    const x = extension({ label: "x", hooks: {
    run(event) { return event.next(); } } })
