id: unitFits
applies: [data, resource, operation, tag]
needs: [promise, why, work]
kind: choice
status: provisional
compare: kind
ask: >-
  Which unit fits this node:
  data, resource, operation, or tag?
choices:
  data: >-
    a value read over time,
    written by an operation
  resource: >-
    something that subscribes, listens,
    polls, connects, opens, or streams;
    built once; cleanup is defer
  operation: >-
    something asked for once per call,
    with typed input; may have effects
  tag: >-
    an environment choice, bound at
    the root and rebound in tests
shapes:
  data: >-
    const x = data({ label: "x", initial });
    // written by an operation or a driver;
    read with watch / useData
  resource: >-
    const x = resource({ label: "x", target, depends,
    factory: (deps, { defer, signal }) => { …;
    defer(() => stop()); return api; } })
  operation: >-
    const x = operation({ label: "x", input: shape.parse,
    depends, run: async (deps, ctx) => { … } })
  tag: >-
    const x = tag<Config>({ label: "x" });
    // bound at the root:
    createScope({ tags: [x(value)] })
