# Trial only (thread "Speed up Tinker build and release"): time a full
# Stryker lane per package on a GitHub-hosted runner, with --incremental,
# and keep the incremental file as the base. Runs on this branch only.
name: mutation-hosted-trial

on:
  push:
    branches: [claude/project-thread-p5j11r]

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, cli, react]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Browser for the React tests
        if: matrix.pkg == 'react'
        run: pnpm --dir packages/react exec playwright install --with-deps chromium
      - name: Build
        run: vp run -r build
      - name: Cores
        run: nproc && free -g
      - name: Mutation, full, incremental base
        working-directory: packages/${{ matrix.pkg }}
        run: npx stryker run --incremental --reporters clear-text,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: incremental-${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}/reports/stryker-incremental.json
