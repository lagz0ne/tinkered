# When CI passes on main and main's version has no release yet,
# publish Core, React, and Start as one GitHub release, tag start-vX.Y.Z.
# Landing the bump commit is the release. No registry. The release uses only
# the job's own GITHUB_TOKEN; TINKER_APP_TOKEN refreshes the template repo.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Is this version released yet?
        id: version
        run: |
          VERSION=$(node -p "require('./packages/start/package.json').version")
          TAG="start-v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "$TAG is out already; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "A failed run left a $TAG draft; deleting it to publish again."
            gh release delete "$TAG" --yes
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pack the set
        if: steps.version.outputs.new == 'true'
        run: node scripts/release.mjs "$VERSION"

      - name: Check versions, notes, and registry
        if: steps.version.outputs.new == 'true'
        run: node scripts/release-check.mjs "$VERSION" > notes.md

      # Draft, attach, then publish: the order GitHub gives for immutable releases.
      # Publishing creates the tag on the commit CI just passed.
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          gh release create "$TAG" --draft --target "$SHA" \
            ".release/$TAG/assets/"*.tgz ".release/$TAG/manifest.json" \
            --title "Tinker $VERSION" --notes-file notes.md
          gh release edit "$TAG" --draft=false --latest

      - name: Download and match sha256
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir fetched
          gh release download "$TAG" --dir fetched --pattern '*.tgz'
          jq -r '.assets[] | "\(.sha256)  fetched/\(.file)"' \
            ".release/$TAG/manifest.json" | sha256sum --check

      # Refresh the template repo: each variation branch plus its new tag (ADR 0115).
      # The job's own token reaches only this repo, so this push needs TINKER_APP_TOKEN:
      # a fine-grained token with contents write on lagz0ne/tinker-app. Without it, skip.
      - name: Refresh tinker-app
        if: steps.version.outputs.new == 'true'
        env:
          TINKER_APP_TOKEN: ${{ secrets.TINKER_APP_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "$TINKER_APP_TOKEN" ]; then
            echo "::warning::No TINKER_APP_TOKEN; run scripts/template-sync.mjs --push by hand."
            exit 0
          fi
          node scripts/template-sync.mjs "$RUNNER_TEMP/tinker-app" --push \
            "https://x-access-token:${TINKER_APP_TOKEN}@github.com/lagz0ne/tinker-app.git"
