# When CI passes on main and main's version has no release yet,
# publish the packages as one GitHub release, tag vX.Y.Z, then to npm.
# Landing the bump commit is the release. The GitHub release uses only the
# job's own GITHUB_TOKEN; npm uses trusted publishing (OIDC), no token
# (ADR 0146). Start is sunset (ADR 0122): no Start tarball;
# old start-vX.Y.Z releases stay as they are.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, tinkered-box]
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The box runner is not the hosted image: add the CLI this job needs when it lacks it.
      - name: Tools
        run: command -v gh >/dev/null || { apt-get update -qq && apt-get install -y -qq gh; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Is this version released yet?
        id: version
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "$TAG is out already; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "A failed run left a $TAG draft; deleting it to publish again."
            gh release delete "$TAG" --yes
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22

      # The build covers the site app, and the site builds on Bun, as ci does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.version.outputs.new == 'true'
        with:
          bun-version: 1.4.x

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pack Core and React
        if: steps.version.outputs.new == 'true'
        run: node scripts/release.mjs "$VERSION"

      - name: Check versions and notes
        if: steps.version.outputs.new == 'true'
        run: node scripts/release-check.mjs "$VERSION" > notes.md

      # Draft, attach, then publish: the order GitHub gives for immutable releases.
      # Publishing creates the tag on the commit CI just passed.
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          gh release create "$TAG" --draft --target "$SHA" \
            ".release/$TAG/assets/"*.tgz ".release/$TAG/manifest.json" \
            --title "Tinker $VERSION" --notes-file notes.md
          gh release edit "$TAG" --draft=false --latest

      - name: Download and match sha256
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir fetched
          gh release download "$TAG" --dir fetched --pattern '*.tgz'
          jq -r '.assets[] | "\(.sha256)  fetched/\(.file)"' \
            ".release/$TAG/manifest.json" | sha256sum --check

  # npm accepts OIDC only from a GitHub-hosted runner, so this job runs there.
  # It builds nothing: it publishes the npm tarballs the box job attached.
  # A package npm does not know yet is skipped: its first publish and its
  # trust are Duke's one-time step, scripts/npm-setup.sh (ADR 0146).
  npm:
    needs: publish
    if: needs.publish.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: npm with trusted publishing
        run: npm install --global npm@12.2.2
      - name: Download the npm tarballs
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern 'npm-tinkered-*.tgz'
      - name: Publish
        run: |
          for t in npm-tinkered-*-"$VERSION".tgz; do
            name="@tinkered/$(basename "$t" | sed -E 's/^npm-tinkered-(.*)-[0-9.]+\.tgz$/\1/')"
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "::warning::$name is not on npm yet. Run scripts/npm-setup.sh once."
              continue
            fi
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is on npm already."
              continue
            fi
            npm publish "$t" --access public
          done
