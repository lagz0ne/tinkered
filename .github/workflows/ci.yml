# The gates a contributor runs, on every push to main (trunk-based, no PRs).
# Mutation and timing stay on the bench box: they need its quiet core.
# The jobs run on the self-hosted runner on the Dokploy box (`tinkered-box`):
# hosted minutes stopped on 2026-11-06. Only main's pushes trigger it.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: [self-hosted, tinkered-box]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # The bun package's tests serve a real socket with Bun.serve (ADR 0130).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Browser for the React tests
        run: pnpm --dir packages/react exec playwright install --with-deps chromium

      - name: Build
        run: vp run -r build

      # perf/session-slots: Core's hot names keep one-byte V8 context slots.
      # It ran only in `pnpm validate`, so a broken path went unseen from 0.13 to 0.14.1.
      - name: Hot names at V8 slot 255 or lower
        run: node scripts/check-slots.mjs

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Prose
        run: vp run prose

      # ADR 0143: each code example in a package's skills compiles against its source.
      - name: Skills
        run: vp run skills

      # The site keeps the template's own gates: its lint, types and plain-function check.
      - name: Site checks
        working-directory: apps/site
        run: bun run typecheck && bun run check:plain && bun --bun vp check

      - name: Release check
        run: node --test scripts/release-check.test.mjs

      - name: Lint rules
        run: node --test packages/analyze/tests/cell-write.node-test.mjs

  # Bun is the main runtime: Core and React tests, then the built dist, on Bun.
  # pnpm installs (bun install cannot read this pnpm workspace) and the build runs
  # on Node (Core's build plugin uses the TypeScript API, which needs Node).
  bun:
    runs-on: [self-hosted, tinkered-box]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Browser for the React tests
        run: pnpm --dir packages/react exec playwright install --with-deps chromium

      - name: Build Core and React
        run: vp run --filter "@tinker/react..." build

      - name: Core tests on Bun
        working-directory: packages/core
        run: bun --bun vp test

      - name: React tests on Bun
        working-directory: packages/react
        run: bun --bun vp test

      - name: Smoke the built dist on Bun
        run: bun scripts/bun-smoke.mjs
