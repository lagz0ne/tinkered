# The gates a contributor runs, on every push to main (trunk-based, no PRs).
# Mutation and timing stay on the bench box: they need its quiet core.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Browser for the React tests
        run: pnpm --dir packages/react exec playwright install --with-deps chromium

      - name: Build
        run: vp run -r build

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Prose
        run: vp run prose

      - name: Release check
        run: node --test scripts/release-check.test.mjs
