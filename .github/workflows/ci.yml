# The gates a contributor runs, on every push to main (trunk-based, no PRs).
# Timing stays on the bench box: it needs its quiet core. Mutation runs in
# mutation.yml (ADR 0170). The three jobs run side by side on GitHub-hosted
# runners (ADR 0171): tinkered is public, so they cost nothing, and the box
# keeps its cores for model runs. ubuntu-24.04: ubuntu-latest is 26.04,
# which Playwright 1.55 lacks. Only main's pushes trigger it.
name: ci

on:
  push:
    branches: [main, claude/project-thread-p5j11r]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # The bun package's tests serve a real socket with Bun.serve (ADR 0130).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Browser for the React tests
        run: pnpm --dir packages/react exec playwright install --with-deps chromium

      - name: Build
        run: vp run -r build

      # perf/session-slots: Core's hot names keep one-byte V8 context slots.
      # It ran only in `pnpm validate`, so a broken path went unseen from 0.13 to 0.14.1.
      - name: Hot names at V8 slot 255 or lower
        run: node scripts/check-slots.mjs

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Prose
        run: vp run prose

      # ADR 0143: each code example in a package's skills compiles against its source.
      - name: Skills
        run: vp run skills

      # The site keeps the template's own gates: its lint, types and plain-function check.
      - name: Site checks
        working-directory: apps/site
        run: bun run typecheck && bun run check:plain && bun --bun vp check

      - name: Release check
        run: node --test scripts/release-check.test.mjs

      - name: Lint rules
        run: node --test packages/cli/tests/cell-write.node-test.mjs

      # A page build that names a backend entry export fails (`browser` condition); needs dist.
      - name: Backend entries stay out of a page
        run: node --test packages/entry/tests/page.node-test.mjs

  # Every deterministic budget lane (`pnpm validate`), so a red lane shows on the push
  # that made it. The fast-code lane pins the engine, so Node comes from its baseline.
  validate:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node version from the fast-code baseline
        id: engine
        run: |
          node=$(sed -n 's/.*"node": *"v\([^"]*\)".*/\1/p' scripts/fast-code-baseline.json)
          echo "node=$node" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ steps.engine.outputs.node }}

      # The client lane builds the site with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build
        run: vp run -r build

      - name: Validate
        run: pnpm validate

  # Bun is the main runtime: Core and React tests, then the built dist, on Bun.
  # pnpm installs (bun install cannot read this pnpm workspace) and the build runs
  # on Node (Core's build plugin uses the TypeScript API, which needs Node).
  bun:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Browser for the React tests
        run: pnpm --dir packages/react exec playwright install --with-deps chromium

      - name: Build Core and React
        run: vp run --filter "@tinkered/react..." build

      - name: Core tests on Bun
        working-directory: packages/core
        run: bun --bun vp test

      - name: React tests on Bun
        working-directory: packages/react
        run: bun --bun vp test

      - name: Smoke the built dist on Bun
        run: bun scripts/bun-smoke.mjs
