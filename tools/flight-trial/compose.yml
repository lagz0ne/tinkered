name: flight-trial
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight-local-only
      POSTGRES_DB: flight
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - flight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:${SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-58025}:8025"
volumes:
  flight-postgres:
