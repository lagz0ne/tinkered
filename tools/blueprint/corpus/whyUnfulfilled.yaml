id: whyUnfulfilled
applies: [data, resource, operation, tag]
needs: [why, promise, depends, uses]
kind: boolean
status: provisional
ask: >-
  Does why either repeat promise instead
  of giving a reason, or name a reason
  that no node in uses fulfils?
true: >-
  why repeats the promise, or names
  a reason that no dep fulfils
false: >-
  why names a reason that a dep in
  depends fulfils; a node with no
  depends only needs a reason that
  is not its promise
